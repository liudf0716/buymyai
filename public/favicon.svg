<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Outer Hex / Diamond Tech Shield -->
  <path d="M256 64 L416 144 V304 L256 448 L96 304 V144 Z" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round" />

  <!-- Center X & AI Spark Emblem -->
  <g filter="url(#glow)">
    <!-- X Arms with Gradient Fill -->
    <path d="M176 176 L336 336 M336 176 L176 336" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Center AI Sparkle -->
    <path d="M256 200 C256 230 230 256 200 256 C230 256 256 282 256 312 C256 282 282 256 312 256 C282 256 256 230 256 200 Z" fill="#FFFFFF"/>
  </g>

  <!-- Verified Checkmark Icon Badge in Bottom Right -->
  <circle cx="384" cy="384" r="56" fill="#2563EB" stroke="#0B0F17" stroke-width="12"/>
  <path d="M356 384 L376 404 L416 364" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
